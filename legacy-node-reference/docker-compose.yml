
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jalur
      POSTGRES_USER: jalur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    volumes:
      - jalur_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalur -d jalur"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - private

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://jalur:${POSTGRES_PASSWORD}@db:5432/jalur
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../data:/data:ro
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  jalur_pgdata:

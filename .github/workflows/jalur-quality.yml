name: JALUR quality checks

on:
  push:
    branches:
      - main
      - migration/python-fastapi
  pull_request:
    branches:
      - main
      - migration/python-fastapi

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/scripts

      - name: Run automated repository tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check central.js

      - name: Verify structured-choice pages and preserved workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.js").read_text(encoding="utf-8")
          central = Path("central.js").read_text(encoding="utf-8")
          index = Path("index.html").read_text(encoding="utf-8")

          for filename, content in (("app.js", app), ("central.js", central)):
              assert "<textarea" not in content.lower(), f"Unexpected textarea in {filename}"

          for page, next_page in (
              ("function realityPage()", "function similarityPage()"),
              ("function campusPage()", "function costPage()"),
          ):
              start = app.index(page)
              end = app.index(next_page, start + len(page))
              section = app[start:end]
              assert "contenteditable" not in section.lower(), f"Free-text editor remains in {page}"

          assert 'choiceChecklist("realityQuestions"' in app
          assert 'choiceChecklist("campusQuestions"' in app
          assert 'choiceChecklist("ventTopics"' in app
          assert 'function bkPortalPage()' in app
          assert 'data-page="BK Consultation"' in index
          assert 'data-page="Anonymous Venting"' in index
          assert "login('moderator')" in central
          assert "login('platform')" in central
          assert "wellbeing_moderator" in central and "platform_admin" in central
          assert "function roleRoute(page,role)" in central
          assert "role==='wellbeing_moderator'?'server-vent':'vent'" in central
          assert "role==='student'?'appointment':schoolStaff?'server-bk':null" in central
          assert "role==='platform_admin')return 'server-platform'" in central
          assert "guestMode&&['BK Consultation','Anonymous Venting'].includes(page)" in central
          assert "['teacher','school_admin'].includes(role))return 'grades'" in central
          assert "credentials:'include'" in central and "X-CSRF-Token" in central
          assert "https://jalur-api.vercel.app" in index
          print("Structured forms, guest BK/curhat, role routing, and API security wiring checks passed.")
          PY

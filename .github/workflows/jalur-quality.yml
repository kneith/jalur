name: JALUR quality checks

on:
  push:
    branches:
      - migration/python-fastapi
  pull_request:
    branches:
      - migration/python-fastapi

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/scripts

      - name: Run automated repository tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check central.js

      - name: Verify structured-choice pages do not render textareas
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ("app.js", "central.js"):
              content = Path(filename).read_text(encoding="utf-8").lower()
              assert "<textarea" not in content, f"Unexpected textarea in {filename}"
          app = Path("app.js").read_text(encoding="utf-8")
          assert 'choiceChecklist("realityQuestions"' in app
          assert 'choiceChecklist("campusQuestions"' in app
          print("Structured-choice checks passed.")
          PY

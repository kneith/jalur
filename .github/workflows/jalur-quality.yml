name: JALUR quality checks

on:
  push:
    branches:
      - main
      - migration/python-fastapi
  pull_request:
    branches:
      - main
      - migration/python-fastapi

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/scripts

      - name: Run automated repository tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check central.js

      - name: Verify structured-choice pages and preserved workflows
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          app = Path("app.js").read_text(encoding="utf-8")
          central = Path("central.js").read_text(encoding="utf-8")
          index = Path("index.html").read_text(encoding="utf-8")

          for filename, content in (("app.js", app), ("central.js", central)):
              assert "<textarea" not in content.lower(), f"Unexpected textarea in {filename}"

          for page, next_page in (
              ("function realityPage()", "function similarityPage()"),
              ("function campusPage()", "function costPage()"),
          ):
              start = app.index(page)
              end = app.index(next_page, start + len(page))
              section = app[start:end]
              assert "contenteditable" not in section.lower(), f"Free-text editor remains in {page}"

          assert 'choiceChecklist("realityQuestions"' in app
          assert 'choiceChecklist("campusQuestions"' in app
          assert 'choiceChecklist("ventTopics"' in app
          assert 'function bkPortalPage()' in app
          assert 'data-page="BK Consultation"' in index
          assert 'data-page="Anonymous Venting"' in index
          assert "login('moderator')" in central
          assert "login('platform')" in central
          assert "wellbeing_moderator" in central and "platform_admin" in central
          assert "function roleRoute(page,role)" in central
          assert 'if(page==="Anonymous Venting")return role==="student"?"vent":role==="wellbeing_moderator"?"server-vent":null;' in central
          assert 'if(page==="BK Consultation")return role==="student"?"appointment":null;' in central
          assert 'platform_admin:"server-platform"' in central
          assert "if(!nav||!user)return;" in central  # Public guest navigation remains in the app layer.
          assert 'if(page==="Academic Profile")return role==="student"?undefined:role==="teacher"?"grades":null;' in central
          assert 'if(["Study Tracer Alumni","SNBT Predictor","SNBP Data"].includes(page))return undefined;' in central
          assert "credentials:'include'" in central and "X-CSRF-Token" in central
          assert "https://jalur-api.vercel.app" in index
          admissions = json.loads(gzip.decompress(base64.b64decode(Path("data/admissions/admissions-data.b64").read_bytes())))
          assert len(admissions["alumni"]) == 252
          assert len(admissions["snbt"]) == 4643
          assert len({row[0] for row in admissions["snbt"]}) == 4643
          assert {row[3] for row in admissions["snbt"]} == {"S1", "D-III", "D-IV"}
          assert len(admissions["snbp"]["topProgramsByApplicants"]) == 20
          assert len(admissions["snbp"]["mirrorUrls"]) == 43
          vercel = json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          assert any(item.get("src") == "data/admissions/admissions-data.b64" for item in vercel["builds"])
          assert any(item.get("source") == "/data/admissions/admissions-data.b64" for item in vercel.get("headers", []))
          assert '"Study Tracer Alumni":admissionsAlumniPage' in app
          assert '"SNBT Predictor":snbtPredictorPage' in app and '"SNBP Data":snbpDataPage' in app
          assert "function applyAlumniFilters(resetPage=true)" in app
          assert 'const rows=$(".alumni-data-row"),matches=[];' in app
          assert "function admissionNameScore(a,b)" in app and "async function admissionNameScore" not in app
          assert "jalurSnbtRenderTimer" in app
          assert "formatNum=admissionFormatNum" in app
          assert "function snbtResultsHtml()" in app and "function loadSnbtWeights()" in app and "function renderSnbtResults()" in app
          assert 'class="filter-grid"' not in app and 'class="stats-grid"' not in app and 'class="link-list"' not in app
          assert "20261115-runtime-fix-v6" in index
          assert "20261115-layout-stability-v1" in index
          assert "async function showProgramDetail(id)" in app
          assert 'id="snbpSearch"' in app
          assert "weightsMap=window.JALUR_SNBT_WEIGHTS" in app
          assert "admissionNameScore" in app
          assert "updateAmbient" not in app
          assert 'class="ambient" aria-hidden="true" hidden' in index
          print("Structured forms, roles, admissions data integrity, static assets, and API security checks passed.")
          PY
